<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Puzzle Pits</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 14px sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #game { display: flex; align-items: center; justify-content: center; background: #000; }
  #game:fullscreen { width: 100vw; height: 100vh; }
  canvas { image-rendering: pixelated; outline: none; touch-action: none; }
  /* a phone: no page panning, zooming or text selection under the fingers */
  html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { touch-action: none; }
  #bar { margin: .6em 1em; text-align: center; }
  #bar p { margin: .3em 0; }
  button { font: inherit; margin: 0 .3em; padding: .3em .9em; background: #333; color: #eee; border: 1px solid #666; border-radius: 4px; cursor: pointer; }
  button:hover { background: #444; }
  a { color: #8cf; }
  /* the phone keyboard's input: on the page (a hidden input gets no keyboard) but out of sight */
  #typing { position: fixed; left: -100px; top: 0; width: 50px; font-size: 16px; opacity: 0; }
</style>
</head>
<body>
<div id="game"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="bar">
  <p id="status">Loading The Puzzle Pits…</p>
  <p><button id="full" title="Alt+Enter">Full screen</button><button id="again" hidden>Play again</button><button id="kbd" hidden>Keyboard</button></p>
  <input id="typing" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Type for the game">
  <p>Arrow keys or the mouse to move, Enter to go on; the sound starts with your first key or click.
    Abe Pralle's 1995 DOS game, <a href="https://github.com/LaPingvino/The-Puzzle-Pits">on GitHub</a>.
    Make your own pits in the <a href="editor/">level editor</a>.</p>
</div>
<script>
  var canvas = document.getElementById("canvas");
  var game = document.getElementById("game");
  var Module = {
    canvas: canvas,
    setStatus: function (s) { document.getElementById("status").textContent = s || ""; },
    onRuntimeInitialized: function () { canvas.focus(); },
    // Quit: out of full screen, and a way to play again (the game has
    // ended; a fresh one is the page again)
    onExit: function () {
      if (document.fullscreenElement) document.exitFullscreen();
      document.getElementById("status").textContent = "Thanks for playing The Puzzle Pits.";
      document.getElementById("full").hidden = true;
      document.getElementById("again").hidden = false;
      document.getElementById("again").focus();
    },
  };
  canvas.addEventListener("click", function () { canvas.focus(); });
  // Touch screens: a Keyboard button brings up the phone's keyboard for the
  // riddles and the password. Each character goes to the game as a key
  // (pits_type); "  " stays in the box so a Backspace still has something
  // to delete.
  (function () {
    var kbd = document.getElementById("kbd"), typing = document.getElementById("typing");
    var KEEP = "  ";
    function send(c) { if (Module._pits_type) Module._pits_type(c); }
    function reset() { typing.value = KEEP; typing.setSelectionRange(KEEP.length, KEEP.length); }
    if (matchMedia("(pointer: coarse)").matches || /[?&]kbd/.test(location.search)) kbd.hidden = false;
    kbd.addEventListener("click", function () { reset(); typing.focus(); });
    typing.addEventListener("input", function () {
      var v = typing.value;
      if (v.length < KEEP.length) for (var i = v.length; i < KEEP.length; i++) send(8);
      else for (var ch of v.slice(KEEP.length)) { var c = ch.codePointAt(0); if (c >= 32 && c <= 126) send(c); }
      reset();
    });
    // Enter goes to the game; no key event from this box reaches the game twice
    function own(e) {
      e.stopPropagation();
      if (e.type === "keydown" && e.key === "Enter") { e.preventDefault(); send(13); }
    }
    ["keydown", "keyup", "keypress"].forEach(function (t) { typing.addEventListener(t, own); });
  })();
  document.getElementById("again").addEventListener("click", function () { location.reload(); });
  function toggleFull() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (game.requestFullscreen) game.requestFullscreen().then(function () { canvas.focus(); });
  }
  document.getElementById("full").addEventListener("click", toggleFull);
  // Alt+Enter, as on the desktop (before the game takes it for Enter)
  addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.altKey) {
      e.preventDefault();
      e.stopImmediatePropagation();
      toggleFull();
    }
  }, true);
  // the 320x200 screen at the biggest whole multiple that fits, so every
  // pixel is as wide as the next (a fraction made the letters uneven) — but
  // when that would leave it under twice its size (a phone), as large as fits
  // instead: a usable screen matters more there than even pixels
  function fit() {
    var full = document.fullscreenElement === game;
    var room = full ? innerHeight : innerHeight - document.getElementById("bar").offsetHeight - 16;
    var fitK = Math.min(innerWidth / 320, room / 200);
    var k = Math.max(1, Math.floor(fitK));
    if (k < 2) k = Math.max(fitK, 0.5);
    canvas.style.width = Math.floor(320 * k) + "px";
    canvas.style.height = Math.floor(200 * k) + "px";
  }
  addEventListener("resize", fit);
  document.addEventListener("fullscreenchange", fit);
  fit();
</script>
{{{ SCRIPT }}}
</body>
</html>
