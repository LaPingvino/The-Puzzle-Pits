<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Puzzle Pits</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 14px sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; outline: none; }
  p { margin: .6em 1em; text-align: center; }
  a { color: #8cf; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<p id="status">Loading The Puzzle Pits…</p>
<p>Arrow keys or the mouse to move, Enter to go on; the sound starts with your first key or click.
  Abe Pralle's 1995 DOS game, <a href="https://github.com/LaPingvino/The-Puzzle-Pits">on GitHub</a>.</p>
<script>
  var canvas = document.getElementById("canvas");
  var Module = {
    canvas: canvas,
    setStatus: function (s) { document.getElementById("status").textContent = s || ""; },
    onRuntimeInitialized: function () { canvas.focus(); },
  };
  canvas.addEventListener("click", function () { canvas.focus(); });
  // the 320x200 screen at the biggest whole multiple that fits, so every
  // pixel is as wide as the next (a fraction made the letters uneven)
  function fit() {
    var room = innerHeight - document.querySelectorAll("p")[1].offsetHeight - 24;
    var k = Math.max(1, Math.floor(Math.min(innerWidth / 320, room / 200)));
    if (innerWidth < 320) k = innerWidth / 320; // a narrow phone: smaller
    canvas.style.width = 320 * k + "px";
    canvas.style.height = 200 * k + "px";
  }
  addEventListener("resize", fit);
  fit();
</script>
{{{ SCRIPT }}}
</body>
</html>
